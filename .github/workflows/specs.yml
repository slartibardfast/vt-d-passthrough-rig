name: specs
on: [push]
jobs:
  allium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: install the toolchain
        run: |
          # 3.6.1 pinned: `allium plan` takes spec FILES (a directory arg is
          # os error 21); check/analyse tolerate directories, plan does not.
          cargo install allium-cli --version 3.6.1 --locked
          pip install hypothesis pytest
          # qemu-img is not on the runner image. golden-build.sh converts the
          # working disk and run-experiment.sh creates the overlay on top of it, so
          # the loop's own tests need it here or the lane would skip the very thing
          # it is meant to be checking.
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils
      - name: check
        run: allium check specs
      - name: analyse
        run: allium analyse specs
      - name: plan
        run: |
          allium plan specs/szdd.allium
          allium plan specs/patch.allium
          allium plan specs/kdwire.allium
          allium plan specs/walk.allium
      - name: tests
        run: |
          python -m venv venv
          ./venv/bin/pip install hypothesis pytest
          # -rs, so the lane states what it chose not to run. A skip the lane does not name
          # is indistinguishable from a check that passed, and a lane must be able to say
          # which of its artifacts it exercised.
          ./venv/bin/python -m pytest tests/ -q -rs
      - name: obligations
        run: |
          cargo install --git https://github.com/connollydavid/host-lifecycle host-lifecycle
          host-lifecycle obligations specs/szdd.allium --tests tests --strict-discharge
          host-lifecycle obligations specs/patch.allium --tests tests --strict-discharge
          host-lifecycle obligations specs/kdwire.allium --tests tests --strict-discharge
          host-lifecycle obligations specs/walk.allium --tests tests --strict-discharge
      - name: run the disposition runners
        run: |
          # `--strict-discharge` proves a disposition names a real test and a real symbol. It cannot
          # prove the named test passes. The dispositions are shell runners, so this step runs every
          # one of them: a link that points at a failing test reddens the lane here rather than
          # reading as a discharged obligation.
          set -u
          source ./tests/dispositions.sh
          failed=0
          for name in $(grep -oE '^[a-z0-9_]+\(\) \{' tests/dispositions.sh | sed 's/() {//'); do
            if ! "$name" > /dev/null; then
              echo "RUNNER FAILED  $name"
              failed=1
            fi
          done
          exit "$failed"
