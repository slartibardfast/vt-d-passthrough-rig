name: specs
on: [push]
jobs:
  allium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: install the toolchain
        run: |
          # 3.6.1 pinned: `allium plan` takes spec FILES (a directory arg is
          # os error 21); check/analyse tolerate directories, plan does not.
          cargo install allium-cli --version 3.6.1 --locked
          pip install hypothesis pytest
      - name: check
        run: allium check specs
      - name: analyse
        run: allium analyse specs
      - name: plan
        run: |
          allium plan specs/szdd.allium
          allium plan specs/patch.allium
      - name: tests
        run: |
          python -m venv venv
          ./venv/bin/pip install hypothesis pytest
          ./venv/bin/python -m pytest tests/test_szdd.py -q
      - name: obligations
        run: |
          cargo install --git https://github.com/connollydavid/host-lifecycle host-lifecycle
          host-lifecycle obligations specs/szdd.allium --tests tests --strict-discharge
          host-lifecycle obligations specs/patch.allium --tests tests --strict-discharge
