; CSMWrap configuration for the R9 290X passthrough VM.
;
; vgabios is deliberately empty. CSMWrap then uses the card's own built-in OpROM,
; which for the 290X is the legacy ATOMBIOS at offset 0 of its hybrid ROM, falling
; back to SeaVGABIOS only if no card OpROM is present. That gives the exact-match
; vendor VBIOS rather than a generic one.
;
; vga pins the selection to the passed-through 290X at its pinned guest address, so
; QEMU's std VGA cannot win the legacy-VGA arbitration by being first.
serial = true
serial_port = 0x3f8
serial_baud = 115200
vgabios =
vga = 00:02.0
iommu_disable = true
verbose = false
