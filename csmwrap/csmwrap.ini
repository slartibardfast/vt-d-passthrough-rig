; CSMWrap configuration for the R9 290X passthrough VM, boot phase (after install).
;
; oprom = false: the card's legacy OpROM cannot POST on this host. It spins polling an
; unclaimed IO port instead of failing, and dispatching it triple-faulted the guest. The
; key sends CSMWrap to its documented SeaVGABIOS fallback instead of the card's Option ROM.
;
; SeaVGABIOS needs only a framebuffer, taken from whichever device is VGA class, and with
; no emulated VGA present that device is the card. The CSM-phase console does not come
; from the card's ROM, which is why oprom = false costs nothing here. The ROM is hybrid
; rather than legacy-only, so it does carry a GOP that OVMF finds; it is the legacy
; OpROM that cannot POST and is kept out of dispatch.
;
; vga pins the selection to the passed-through 290X at its pinned guest address, 00:04.0,
; so the card holds the legacy-VGA role in every phase.
;
; iommu_disable = false: a no-op in this guest (QEMU pc exposes no DMAR/IVRS), set false so
; the file states what the VFIO guest needs rather than inheriting a default written for
; class-3 bare metal.
serial = true
serial_port = 0x3f8
serial_baud = 115200
vgabios =
oprom = false
vga = 00:04.0
iommu_disable = false
verbose = false