; Install-time CSMWrap configuration, stage 3 of the from-scratch runbook.
;
; oprom = false: the 290X's legacy OpROM cannot POST on this host. It spins
; polling an unclaimed IO port instead of failing, and when SeaBIOS dispatched
; it the guest triple-faulted. The key makes CSMWrap take the documented
; SeaVGABIOS fallback instead of the card's Option ROM.
;
; SeaVGABIOS does not need the card's Option ROM and does not need a GOP. It
; renders into the framebuffer of whichever device is VGA class, and with std VGA
; absent the card is that device. So the card's BAR is the console, and its ROM
; being useless costs nothing.
;
; iommu_disable = false: a no-op in this guest (QEMU pc exposes no DMAR/IVRS),
; set false so the file means what the VFIO guest needs rather than inheriting
; a default written for class-3 bare metal.
;
; vga = 00:04.0 is the passthrough 290X, and with no std VGA present it is the
; guest's only display, which is what this project is for.
;
; The card's 128 KiB ROM is hybrid: 64 KiB of legacy ATOMBIOS at offset 0 and a
; 58368-byte EFI image at 0x10000, with signature 0x0EF1 and PCIR 1002:67b0. So
; it does carry a GOP, OVMF does find it, and the CSMWrap splash does appear on
; the physical monitor. An earlier claim in this file said the ROM had no UEFI
; payload and that OVMF found no GOP; that was wrong, contradicted by both the
; ROM bytes and the observed splash. Serve the whole 128 KiB via romfile, not an
; extracted slice of the EFI image.
;
; The CSM-phase console is SeaVGABIOS rather than OVMF, because oprom = false
; keeps the card's own legacy Option ROM out of dispatch. SeaVGABIOS renders into
; the card's BAR0, which SeaBIOS reports as "Found FB @ c0000000".
; gop_resolution = 1024x768: ask the card's GOP for a framebuffer at least this
; big, instead of keeping whichever mode the firmware happened to pick.
;
; OVMF picks 800x600 here. SeaVGABIOS can only advertise the VESA modes that fit
; the framebuffer it is handed, so an 800x600 framebuffer leaves exactly four:
; 0x140 320x200x32, 0x141 640x400x32, 0x142 640x480x32, 0x143 800x600x32.
; Windows Setup and NTLDR look for 800x600 or 1024x768, and 1024x768x32 (0x144)
; falls outside an 800x600 framebuffer, so the guest is never offered the mode
; it wants. A 1024x768 framebuffer brings 0x144 into range.
;
; Without this key CSMWrap keeps the firmware's current mode whenever that mode is
; usable, and only enumerates the card's other modes when it is not, so the card
; is never asked for a larger one. See src/video.c, FindGop.
  serial = true
serial_port = 0x3f8
serial_baud = 115200
vgabios =
oprom = false
vga = 00:04.0
iommu_disable = false
verbose = false
  gop_resolution = 1024x768
