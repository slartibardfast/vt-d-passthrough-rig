; Install-time CSMWrap configuration, stage 3 of the from-scratch runbook.
;
; oprom = false: this host assigns no legacy VGA resources to any GPU, and the
; 290X's legacy OpROM spins on an unclaimed IO port instead of failing, so the
; documented SeaVGABIOS fallback is unreachable without the fork's oprom key.
; SeaVGABIOS renders into the GOP framebuffer the card provides, which is the
; only console path this host can support before the XP driver loads.
;
; iommu_disable = false: a no-op in this guest (QEMU pc exposes no DMAR/IVRS),
; set false so the file means what the VFIO guest needs rather than inheriting
; a default written for class-3 bare metal.
serial = true
serial_port = 0x3f8
serial_baud = 115200
vgabios =
oprom = false
vga = 00:04.0
iommu_disable = false
verbose = false
